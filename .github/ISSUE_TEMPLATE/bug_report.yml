name: Bug report
description: Report a problem with the website
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Check for an existing issue before submitting a new report.
  - type: input
    id: page
    attributes:
      label: Page or URL
      description: Where did you encounter the problem?
      placeholder: https://...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, and what did you expect to happen?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Firefox on Ubuntu, Safari on iPhone, etc.
    validations:
      required: false
